name: Build dipper SUSFS kernel

on:
  workflow_dispatch:

env:
  OUT_DIR: ${{ github.workspace }}/out
  CC_BIN: clang13/clang/host/linux-x86/clang-r428724/bin/clang
  CROSS: clang13/linaro-gcc-4.9/aarch64-linux-gnu/bin/aarch64-linux-gnu-
  CROSS32: clang13/linaro-gcc-4.9/arm-linux-gnueabi/bin/arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip wget zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev \
            python3 libarchive-tools

      - name: Clone AnyKernel3
        run: git clone --depth=1 -b master https://github.com/diyishengqing/AnyKernel3 AnyKernel3

      - name: Clone kernel source (MIUI Android 10 base)
        run: git clone --depth=1 -b 88-zstd https://github.com/diyishengqing/Xiaomi_Kernel_OpenSource-sdm845 kernel

      - name: Clone toolchain
        run: |
          git clone --depth=1 -b clang13 https://github.com/diyishengqing/android-kernel-tools clang13
          echo "$PWD/clang13/bin" >> "$GITHUB_PATH"

      - name: Integrate BakaSU (KernelSU-Next family, keeps non-GKI 4.9 support)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
          ls -1 | grep -i -E 'bakasu|kernelsu|susfs' || true

      - name: Apply SUSFS 4.9 patches
        run: |
          git clone --depth=1 -b kernel-4.9-v2 https://github.com/wxx9248/susfs4ksu susfs
          cp susfs/kernel_patches/fs/susfs.c              kernel/fs/
          cp susfs/kernel_patches/include/linux/susfs.h   kernel/include/linux/
          cp susfs/kernel_patches/include/linux/susfs_def.h kernel/include/linux/
          cd kernel
          patch -p1 --fuzz=3 < ../susfs/kernel_patches/50_add_susfs_in_kernel-4.9.patch

      - name: Tune defconfig (SUSFS on + kernel string spoofed)
        working-directory: kernel
        run: |
          CFG=arch/arm64/configs/dipper_user_defconfig
          {
            echo 'CONFIG_KSU_SUSFS=y'
            echo 'CONFIG_KSU_SUSFS_SUS_PATH=y'
            echo 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
            echo 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
            echo 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
            echo 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
            echo 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
            echo 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
            echo 'CONFIG_KSU_SUSFS_SUS_MAP=y'
            echo '# CONFIG_LOCALVERSION_AUTO is not set'
            echo 'CONFIG_LOCALVERSION="-perf"'
          } >> "$CFG"
          sed -i "s/printf '%s' -dirty/printf '%s' ''/g" scripts/setlocalversion
          grep -n 'LOCALVERSION' "$CFG" | tail -3

      - name: Build kernel
        working-directory: kernel
        run: |
          mkdir -p "$OUT_DIR"
          ARGS="-j$(nproc) O=$OUT_DIR ARCH=arm64 CC=$GITHUB_WORKSPACE/$CC_BIN \
                CROSS_COMPILE=$GITHUB_WORKSPACE/$CROSS \
                CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/$CROSS32"
          make $ARGS dipper_user_defconfig
          make $ARGS

      - name: Pack AnyKernel3
        run: |
          cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          cd AnyKernel3
          zip -q -r "$GITHUB_WORKSPACE/dipper-susfs-$(date +%Y%m%d).zip" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dipper-susfs-kernel
          path: dipper-susfs-*.zip
          retention-days: 7
